name: Build & Deploy to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  DEPLOY_DIR: /home/duyvu/database

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean build -x test -x spotlessCheck

      - name: Stop service and clean directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "Stopping database service..."
            sudo -n /usr/bin/systemctl stop database || true

            echo "Cleaning via systemd database-clean..."
            sudo -n /usr/bin/systemctl start database-clean

            echo "Clean complete."

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: duyvu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "build/libs/app.jar"
          target: ${{ env.DEPLOY_DIR }}

      - name: Start service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "Starting database service..."
            sudo -n /usr/bin/systemctl start database

            echo "Deployment complete."